[project]
name = "infradiag"
version = "0.1.0"
description = "Infrastructure diagrams and drift report from Bicep what-if and Azure Resource Graph"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["pyyaml>=6"]

[project.scripts]
infradiag = "infradiag.cli:main"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infradiag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
# The code is written to roughly 120 columns; E501 is not enabled.
line-length = 120

[tool.ruff.lint]
# Ruff's default rules, plus the lambda-assignment rule the existing
# `noqa: E731` comments refer to.
extend-select = ["E731"]
ignore = [
    "ISC004",  # multi-line strings built by implicit concatenation inside lists are deliberate
    "PLW1510", # subprocess.run callers inspect returncode themselves
    "SIM114",  # separate if-arms with the same body document separate reasons
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF012"] # class-level fixture data on test fakes
